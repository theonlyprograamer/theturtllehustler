<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChargeOne Admin</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#14201a;--mu:#66726b;--ac:#0f9d58;--bd:#e2e6e1;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#101512;--card:#1a211d;--tx:#eaf0ec;--mu:#97a39b;--ac:#2ecc71;--bd:#2a332d;--bad:#ff7a6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
input,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{cursor:pointer;background:var(--card)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.r{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.mu{color:var(--mu);font-size:13px}.no{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}.sc{overflow-x:auto}
</style></head><body>
<h2>⚡ ChargeOne Admin</h2>
<div id="lg" class="card"><div class="r"><input id="u" placeholder="Username" autocapitalize="none"><input id="pw" type="password" placeholder="Password"><button class="p" id="li">Log in</button></div><div class="mu no" id="le"></div></div>
<div id="ad" hidden>
  <div class="r"><button data-t="liv">Live now</button><button data-t="use">Chargers used</button><button data-t="top">Top-ups</button><button data-t="cod">Gift codes</button><button data-t="ref">Refunds</button><button data-t="usr">Users</button><button data-t="stn">Stations</button><button data-t="led">Ledger</button><button id="lo">Log out</button></div>
  <div id="out"></div>
</div>
<script src="config.js"></script>
<script>
let T="",D=null,tab=new URLSearchParams(location.search).get("t")||"liv";const $=i=>document.getElementById(i),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(a,d={}){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a,t:T,...d})});const j=await r.json();if(j.err)throw new Error(j.err);return j}
async function load(){D=await api("adminData");show()}
function show(){const o=$("out");
 if(tab=="liv")o.innerHTML='<div class="mu" style="margin:4px 0 8px">Sessions started but not yet settled. If a user closed the app mid-charge, it stays here.</div>'+(D.live.length?'<div class="card sc"><table><tr><th>Started</th><th>User</th><th>Phone</th><th>Vehicle</th><th>Station</th><th>Charger</th><th>Up to kWh</th><th>Held ₹</th></tr>'+D.live.map(x=>`<tr><td>${e(String(x.ts).slice(0,19).replace("T"," "))}</td><td>${e(x.uid)}</td><td>${e(x.phone)}</td><td>${e(x.veh)}</td><td>${e(x.st)}<div class="mu">${e(x.net)}</div></td><td>${x.pt?"#"+x.pt:"-"}</td><td>${e(x.k)}</td><td>₹${e(x.held)}</td></tr>`).join("")+"</table></div>":'<div class="card mu">Nobody is charging right now.</div>');
 if(tab=="use"){const by={};D.stations.forEach(s=>by[s.n]={s:s,r:[]});D.usage.forEach(x=>{(by[x.st]=by[x.st]||{s:{n:x.st,net:x.net,pts:1},r:[]}).r.push(x)});
  const T2=x=>String(x.ts).slice(0,16).replace("T"," ");
  o.innerHTML='<div class="mu" style="margin:4px 0 8px">Each charger point at a station and who is on it. History = last 300 sessions. Vehicle is the user\'s current active vehicle.</div>'+Object.values(by).map(g=>{const np=+g.s.pts||1,act=g.r.filter(x=>x.open&&!x.stale),stale=g.r.filter(x=>x.open&&x.stale),slots=Array(np).fill(null);
   act.forEach(x=>{if(x.pt&&x.pt<=np&&!slots[x.pt-1])slots[x.pt-1]=x;else x._l=1});act.filter(x=>x._l).forEach(x=>{const k=slots.indexOf(null);if(k>=0)slots[k]=x});
   const kwh=g.r.reduce((a,x)=>a+x.kwh,0),amt=g.r.filter(x=>!x.open).reduce((a,x)=>a+(+x.cost||0),0),used=slots.filter(Boolean).length;
   return `<div class="card"><b>${e(g.s.n)}</b> <span class="mu">${e(g.s.net||"")} · ${used}/${np} in use · ${g.r.length} sessions · ${kwh.toFixed(1)} kWh · ₹${amt.toFixed(2)}</span>`+
   '<div style="margin:8px 0">'+slots.map((x,k)=>`<div>Charger ${k+1}: `+(x?`<b style="color:var(--ac)">used by ${e(x.uid)}</b> <span class="mu">${e(x.veh)} · since ${e(T2(x))}</span>`:'<span class="mu">free</span>')+"</div>").join("")+"</div>"+
   (stale.length?`<div class="mu no">Unsettled for 4h+ (not blocking a charger): ${stale.map(x=>e(x.uid)+" ("+e(T2(x))+")").join(", ")}</div>`:"")+
   (g.r.length?'<div class="sc"><table><tr><th>When</th><th>Charger</th><th>User</th><th>Phone</th><th>Vehicle</th><th>kWh</th><th>₹</th><th></th></tr>'+g.r.map(x=>`<tr><td>${e(T2(x))}</td><td>${x.pt?"#"+x.pt:"-"}</td><td>${e(x.uid)}</td><td>${e(x.phone)}</td><td>${e(x.veh)}</td><td>${e(x.kwh.toFixed?x.kwh.toFixed(2):x.kwh)}</td><td>${e(x.cost)}</td><td>${x.open?(x.stale?"unsettled":"charging"):"done"}</td></tr>`).join("")+"</table></div>":"")+"</div>"}).join("")}
 if(tab=="top")o.innerHTML=D.topups.length?D.topups.map(p=>`<div class="card"><b>₹${e(p.amt)}</b> · UTR ${e(p.id)}<div class="mu">${e(p.uid)} · check your bank/UPI app for this UTR and amount before approving</div><div class="r"><button class="p" data-tid="${e(p.id)}" data-ok="1">Approve</button><button data-tid="${e(p.id)}" data-ok="0">Reject</button></div></div>`).join(""):'<div class="card mu">No pending top-ups.</div>';
 if(tab=="cod")o.innerHTML='<div class="card r"><input data-c="code" placeholder="NEW_CODE_123"><input data-c="amt" type="number" placeholder="₹ amount" size="6"><input data-c="for" placeholder="only for (email, optional)"><label class="mu"><input type="checkbox" data-c="unl"> unlimited</label><button class="p" data-cn="1">Create code</button></div><div class="card sc"><table><tr><th>Code</th><th>₹</th><th>Status</th><th>Used by</th><th>Only for</th></tr>'+D.codes.map(x=>`<tr><td>${e(x.code)}</td><td>${e(x.amount)}</td><td>${e(x.status)}</td><td>${e(x.by)}</td><td>${e(x.f)}</td></tr>`).join("")+"</table></div>";
 if(tab=="ref")o.innerHTML=D.pending.length?D.pending.map(p=>`<div class="card"><b>₹${e(p.amt)}</b> · ${e(p.n)}<div class="mu">${e(p.uid)}</div><div class="r"><button class="p" data-ok="1" data-id="${e(p.id)}">Approve</button><button data-ok="0" data-id="${e(p.id)}">Reject</button></div></div>`).join(""):'<div class="card mu">No pending refunds.</div>';
 if(tab=="usr")o.innerHTML='<div class="card sc"><table><tr><th>ID</th><th>Phone</th><th>Vehicles</th><th>Balance</th><th></th></tr>'+D.users.map(u=>`<tr><td>${e(u.id)}</td><td>${e(u.phone)}</td><td>${e((u.vl||[]).map(v=>(v.type||"Car")+": "+v.make+" "+v.model+" "+v.plate).join("; "))}</td><td>₹${e(u.bal)}</td><td><button data-cr="${e(u.id)}">Add credit</button></td></tr>`).join("")+"</table></div>";
 if(tab=="stn")o.innerHTML=D.stations.concat([{id:0,n:"",net:"",cn:"CCS2",kw:30,p:15,a:1,pts:1}]).map(s=>`<div class="card r" data-s="${s.id}"><input data-f="n" value="${e(s.n)}" placeholder="Station name"><input data-f="net" value="${e(s.net)}" placeholder="Network" size="10"><input data-f="cn" value="${e(s.cn)}" size="7"><input data-f="kw" value="${e(s.kw)}" size="4" title="kW"><input data-f="p" value="${e(s.p)}" size="4" title="₹/kWh"><input data-f="a" value="${e(s.a)}" size="2" title="1=available, 0=busy"><input data-f="pts" value="${e(s.pts||1)}" size="3" title="number of charger points"><button class="p" data-sv="1">${s.id?"Save":"Add"}</button>${s.id?`<button data-sd="${s.id}">Delete</button>`:""}</div>`).join("")+'<div class="mu">To list a new charger, fill the empty last row and press Add. Connector: CCS2, Type 2 or CHAdeMO · kW · ₹ per kWh · available 1/0 (1 = shown as available) · last box = number of charger points at the station</div>';
 if(tab=="led")o.innerHTML='<div class="card sc"><table><tr><th>Time</th><th>User</th><th>Type</th><th>₹</th><th>Note</th></tr>'+D.ledger.map(x=>`<tr><td>${e(String(x.ts).slice(0,16))}</td><td>${e(x.uid)}</td><td>${e(x.type)}</td><td>${e(x.amount)}</td><td>${e(x.note)}</td></tr>`).join("")+"</table></div>"}
$("li").onclick=async()=>{try{T=(await api("adminLogin",{user:$("u").value,pass:$("pw").value})).token;$("lg").hidden=true;$("ad").hidden=false;await load()}catch(x){$("le").textContent=x.message}};
$("lo").onclick=()=>{T="";D=null;$("ad").hidden=true;$("lg").hidden=false;$("pw").value=""};
document.addEventListener("click",async ev=>{const b=ev.target;if(!b.closest("#ad"))return;try{
 if(b.dataset.t){tab=b.dataset.t;await load()}
 if(b.dataset.cn){const r=b.closest(".card");await api("adminCode",{code:r.querySelector("[data-c=code]").value,amount:r.querySelector("[data-c=amt]").value,for:r.querySelector("[data-c=for]").value,unl:r.querySelector("[data-c=unl]").checked});await load()}
 if(b.dataset.tid){await api("adminTopup",{id:b.dataset.tid,ok:b.dataset.ok==="1"});await load()}
 if(b.dataset.id){await api("adminRefund",{id:b.dataset.id,ok:b.dataset.ok==="1"});await load()}
 if(b.dataset.cr){const a=prompt("Credit amount (₹)");if(a){await api("adminAdjust",{uid:b.dataset.cr,amount:a,note:prompt("Note","Admin credit")||"Admin credit"});await load();alert("Done")}}
 if(b.dataset.sd&&confirm("Delete this charger?")){await api("adminStationDel",{id:b.dataset.sd});await load()}
 if(b.dataset.sv){const row=b.closest("[data-s]"),s={id:+row.dataset.s};row.querySelectorAll("[data-f]").forEach(i=>s[i.dataset.f]=i.value);await api("adminStation",{s});await load()}
}catch(x){alert(x.message)}});
try{const s=JSON.parse(localStorage.getItem("chargeone")||"{}");if(s.token&&s.owner){T=s.token;load().then(()=>{$("lg").hidden=true;$("ad").hidden=false}).catch(()=>{T=""})}}catch(e){}
</script></body></html>
