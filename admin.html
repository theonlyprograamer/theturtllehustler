<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChargeOne Admin</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#14201a;--mu:#66726b;--ac:#0f9d58;--bd:#e2e6e1;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#101512;--card:#1a211d;--tx:#eaf0ec;--mu:#97a39b;--ac:#2ecc71;--bd:#2a332d;--bad:#ff7a6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
input,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{cursor:pointer;background:var(--card)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.r{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.mu{color:var(--mu);font-size:13px}.no{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}.sc{overflow-x:auto}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin-left:4px}.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}.live{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
</style></head><body>
<h2>⚡ ChargeOne Admin</h2>
<div id="lg" class="card"><div class="r"><input id="u" placeholder="Username" autocapitalize="none"><input id="pw" type="password" placeholder="Password"><button class="p" id="li">Log in</button></div><div class="mu no" id="le"></div></div>
<div id="ad" hidden>
  <div class="r"><button data-t="liv">🔴 Live</button><button data-t="top">Top-ups</button><button data-t="cod">Gift codes</button><button data-t="ref">Refunds</button><button data-t="usr">Users</button><button data-t="stn">Stations</button><button data-t="led">Ledger</button><button id="lo">Log out</button></div>
  <div id="out"></div>
</div>
<script src="config.js"></script>
<script>
let T="",D=null,tab="liv";const $=i=>document.getElementById(i),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(a,d={}){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a,t:T,...d})});const j=await r.json();if(j.err)throw new Error(j.err);return j}
async function load(){D=await api("adminData");show()}
const sl={charging:"Charging",nosignal:"No signal",stuck:"Stuck"};
function sess(z){const m=Math.max(0,Math.round((Date.now()-z.t0)/60000));return `<div class="live"><b>${e(z.uid)}</b><span class="tag">${sl[z.st]}</span><div class="mu">📞 ${e(z.phone)} · 🚗 ${e(z.veh)} · wallet ₹${e(z.bal)}</div><div>⚡ ${z.kwh.toFixed(2)} / ${e(z.k)} kWh · ₹${e(z.cost)} of ₹${e(z.pre)} held${z.pct!=null?" · 🔋 "+Math.round(z.pct)+"%":""}</div><div class="bar"><i style="width:${Math.min(100,z.kwh/z.k*100)}%"></i></div><div class="mu">started ${m} min ago · last update ${z.ago}s ago</div>${z.st!="charging"?`<button data-fs="${e(z.sid)}">Stop &amp; settle</button>`:""}</div>`}
function show(){const o=$("out");
 if(tab=="liv"){const L=D.live,n=L.st.reduce((s,x)=>s+x.use.length,0)+L.other.length;
  o.innerHTML=`<div class="card">🔴 <b>${n} charging now</b> · ${L.st.filter(x=>!x.use.length).length} chargers free <span class="mu">· refreshes every 5 s</span></div>`+L.st.map(s=>`<div class="card"><div class="r" style="justify-content:space-between;margin:0"><b>${e(s.n)}</b><span class="mu">${e(s.net)} · ${e(s.cn)} · ${e(s.kw)} kW</span></div>${s.use.length?s.use.map(sess).join(""):'<div class="mu">Free</div>'}</div>`).join("")+(L.other.length?`<div class="card"><b>Other open sessions</b> <span class="mu">(charger was renamed or deleted)</span>${L.other.map(sess).join("")}</div>`:"")}
 if(tab=="top")o.innerHTML=D.topups.length?D.topups.map(p=>`<div class="card"><b>₹${e(p.amt)}</b> · UTR ${e(p.id)}<div class="mu">${e(p.uid)} · check your bank/UPI app for this UTR and amount before approving</div><div class="r"><button class="p" data-tid="${e(p.id)}" data-ok="1">Approve</button><button data-tid="${e(p.id)}" data-ok="0">Reject</button></div></div>`).join(""):'<div class="card mu">No pending top-ups.</div>';
 if(tab=="cod")o.innerHTML='<div class="card r"><input data-c="code" placeholder="NEW_CODE_123"><input data-c="amt" type="number" placeholder="₹ amount" size="6"><input data-c="for" placeholder="only for (email, optional)"><label class="mu"><input type="checkbox" data-c="unl"> unlimited</label><button class="p" data-cn="1">Create code</button></div><div class="card sc"><table><tr><th>Code</th><th>₹</th><th>Status</th><th>Used by</th><th>Only for</th><th></th></tr>'+D.codes.map(x=>`<tr><td>${e(x.code)}</td><td>${e(x.amount)}</td><td>${e(x.status)}</td><td>${e(x.by)}</td><td>${e(x.f)}</td><td><button data-cd="${e(x.code)}">Delete</button></td></tr>`).join("")+"</table></div>";
 if(tab=="ref")o.innerHTML=D.pending.length?D.pending.map(p=>`<div class="card"><b>₹${e(p.amt)}</b> · ${e(p.n)}<div class="mu">${e(p.uid)}</div><div class="r"><button class="p" data-ok="1" data-id="${e(p.id)}">Approve</button><button data-ok="0" data-id="${e(p.id)}">Reject</button></div></div>`).join(""):'<div class="card mu">No pending refunds.</div>';
 if(tab=="usr")o.innerHTML='<div class="card sc"><table><tr><th>ID</th><th>Phone</th><th>Vehicles</th><th>Balance</th><th></th></tr>'+D.users.map(u=>`<tr><td>${e(u.id)}</td><td>${e(u.phone)}</td><td>${e((u.vl||[]).map(v=>(v.type||"Car")+": "+v.make+" "+v.model+" "+v.plate).join("; "))}</td><td>₹${e(u.bal)}</td><td><button data-cr="${e(u.id)}">Add credit</button> <button data-dd="${e(u.id)}">Deduct credit</button></td></tr>`).join("")+"</table></div>";
 if(tab=="stn")o.innerHTML=D.stations.concat([{id:0,n:"",net:"",cn:"CCS2",kw:30,p:15,a:1}]).map(s=>`<div class="card r" data-s="${s.id}"><input data-f="n" value="${e(s.n)}" placeholder="Station name"><input data-f="net" value="${e(s.net)}" placeholder="Network" size="10"><input data-f="cn" value="${e(s.cn)}" size="7"><input data-f="kw" value="${e(s.kw)}" size="4" title="kW"><input data-f="p" value="${e(s.p)}" size="4" title="₹/kWh"><input data-f="a" value="${e(s.a)}" size="2" title="1=available, 0=busy"><button class="p" data-sv="1">${s.id?"Save":"Add"}</button>${s.id?`<button data-sd="${s.id}">Delete</button>`:""}</div>`).join("")+'<div class="mu">To list a new charger, fill the empty last row and press Add. Connector: CCS2, Type 2 or CHAdeMO · kW · ₹ per kWh · available 1/0 (1 = shown as available)</div>';
 if(tab=="led")o.innerHTML='<div class="card sc"><table><tr><th>Time</th><th>User</th><th>Type</th><th>₹</th><th>Note</th></tr>'+D.ledger.map(x=>`<tr><td>${e(String(x.ts).slice(0,16))}</td><td>${e(x.uid)}</td><td>${e(x.type)}</td><td>${e(x.amount)}</td><td>${e(x.note)}</td></tr>`).join("")+"</table></div>"}
$("li").onclick=async()=>{try{T=(await api("adminLogin",{user:$("u").value,pass:$("pw").value})).token;$("lg").hidden=true;$("ad").hidden=false;await load()}catch(x){$("le").textContent=x.message}};
$("lo").onclick=()=>{T="";D=null;$("ad").hidden=true;$("lg").hidden=false;$("pw").value=""};
document.addEventListener("click",async ev=>{const b=ev.target;if(!b.closest("#ad"))return;try{
 if(b.dataset.t){tab=b.dataset.t;await load()}
 if(b.dataset.cn){const r=b.closest(".card");await api("adminCode",{code:r.querySelector("[data-c=code]").value,amount:r.querySelector("[data-c=amt]").value,for:r.querySelector("[data-c=for]").value,unl:r.querySelector("[data-c=unl]").checked});await load()}
 if(b.dataset.tid){await api("adminTopup",{id:b.dataset.tid,ok:b.dataset.ok==="1"});await load()}
 if(b.dataset.id){await api("adminRefund",{id:b.dataset.id,ok:b.dataset.ok==="1"});await load()}
 if(b.dataset.cr){const a=prompt("Credit amount (₹)");if(a){await api("adminAdjust",{uid:b.dataset.cr,amount:a,note:prompt("Note","Admin credit")||"Admin credit"});await load();alert("Done")}}

 if(b.dataset.dd){const a=prompt("Amount to DEDUCT (₹)");if(a&&+a>0&&confirm("Deduct ₹"+a+" from "+b.dataset.dd+"?")){await api("adminDeduct",{uid:b.dataset.dd,amount:a,note:prompt("Reason","Admin deduction")||"Admin deduction"});await load();alert("Done")}}
 if(b.dataset.fs&&confirm("Stop this session and settle at the last reported kWh? Unused money goes back to the user's wallet.")){await api("adminSettle",{sid:b.dataset.fs});await load()}
 if(b.dataset.cd&&confirm("Delete gift code "+b.dataset.cd+"? This cannot be undone.")){await api("adminCodeDel",{code:b.dataset.cd});await load()}
 if(b.dataset.sd&&confirm("Delete this charger?")){await api("adminStationDel",{id:b.dataset.sd});await load()}
 if(b.dataset.sv){const row=b.closest("[data-s]"),s={id:+row.dataset.s};row.querySelectorAll("[data-f]").forEach(i=>s[i.dataset.f]=i.value);await api("adminStation",{s});await load()}
}catch(x){alert(x.message)}});
setInterval(async()=>{if(T&&tab==="liv"&&!document.hidden){try{D.live=(await api("adminLive")).live;show()}catch(x){}}},5000);
try{const s=JSON.parse(localStorage.getItem("chargeone")||"{}");if(s.token&&s.owner){T=s.token;load().then(()=>{$("lg").hidden=true;$("ad").hidden=false}).catch(()=>{T=""})}}catch(e){}
</script></body></html>
