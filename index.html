<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Countdown</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: "Poppins", sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }
    .clock-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .time-box {
      background-color: #111;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 20px 15px;
      text-align: center;
      width: 70px;
      box-shadow: 0 0 15px rgba(255,255,255,0.05);
    }
    .time-box span {
      display: block;
      font-size: 2rem;
      animation: flip 1s ease-in-out;
    }
    @keyframes flip {
      0% { transform: rotateX(0deg); }
      50% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }
    .label {
      font-size: 0.8rem;
      margin-top: 5px;
      opacity: 0.7;
    }
    .current-time {
      margin-top: 30px;
      font-size: 1.5rem;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <h1>Time Left Till Midnight</h1>
  <div class="clock-container">
    <div class="time-box"><span id="hours">00</span><div class="label">HRS</div></div>
    <div class="time-box"><span id="minutes">00</span><div class="label">MIN</div></div>
    <div class="time-box"><span id="seconds">00</span><div class="label">SEC</div></div>
  </div>
  <div class="current-time" id="currentTime">Current Time: --:--:--</div>

  <script>
    function updateClock() {
      const now = new Date();
      let hrs = now.getHours();
      const mins = now.getMinutes();
      const secs = now.getSeconds();

      // Convert to 12-hour format
      const ampm = hrs >= 12 ? "PM" : "AM";
      hrs = hrs % 12;
      hrs = hrs ? hrs : 12; // 0 becomes 12

      // Display 12-hour format current time
      document.getElementById('currentTime').innerText =
        `Current Time: ${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')} ${ampm}`;

      // Calculate time left until midnight
      const nextMidnight = new Date();
      nextMidnight.setHours(24, 0, 0, 0);
      const diff = nextMidnight - now;

      let remainingHours = Math.floor(diff / (1000 * 60 * 60));
      let remainingMinutes = Math.floor((diff / (1000 * 60)) % 60);
      let remainingSeconds = Math.floor((diff / 1000) % 60);

      document.getElementById('hours').innerText = remainingHours.toString().padStart(2, '0');
      document.getElementById('minutes').innerText = remainingMinutes.toString().padStart(2, '0');
      document.getElementById('seconds').innerText = remainingSeconds.toString().padStart(2, '0');

      // Flash background at midnight
      if (remainingHours === 0 && remainingMinutes === 0 && remainingSeconds === 0) {
        document.body.style.transition = "background 1s";
        document.body.style.backgroundColor = "#111";
        setTimeout(() => document.body.style.backgroundColor = "#000", 1000);
      }
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
