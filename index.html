<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Message Encryptor</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

textarea,input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    padding:12px 20px;
    margin-right:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.encrypt{
    background:#28a745;
    color:white;
}

.decrypt{
    background:#007bff;
    color:white;
}

.copy{
    background:#444;
    color:white;
}

.output{
    min-height:120px;
}
</style>
</head>
<body>

<div class="container">

<h1>Secure Message Encryptor</h1>

<label>Message / Cipher Text</label>
<textarea id="message" rows="8"></textarea>

<label>Secret Key</label>
<input type="password" id="password" placeholder="Enter secret key">

<button class="encrypt" onclick="encryptMessage()">Encrypt</button>
<button class="decrypt" onclick="decryptMessage()">Decrypt</button>
<button class="copy" onclick="copyOutput()">Copy Output</button>

<h3>Output</h3>
<textarea id="output" class="output" readonly></textarea>

</div>

<script>

const encoder = new TextEncoder();
const decoder = new TextDecoder();

async function deriveKey(password, salt){
    const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        {name:"PBKDF2"},
        false,
        ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name:"PBKDF2",
            salt:salt,
            iterations:100000,
            hash:"SHA-256"
        },
        keyMaterial,
        {
            name:"AES-GCM",
            length:256
        },
        false,
        ["encrypt","decrypt"]
    );
}

function bufferToBase64(buffer){
    return btoa(String.fromCharCode(...new Uint8Array(buffer)));
}

function base64ToBuffer(base64){
    return Uint8Array.from(atob(base64), c => c.charCodeAt(0));
}

async function encryptMessage(){

    const message = document.getElementById("message").value;
    const password = document.getElementById("password").value;

    if(!message || !password){
        alert("Enter message and key");
        return;
    }

    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));

    const key = await deriveKey(password,salt);

    const encrypted = await crypto.subtle.encrypt(
        {name:"AES-GCM",iv:iv},
        key,
        encoder.encode(message)
    );

    const combined = new Uint8Array(
        salt.length + iv.length + encrypted.byteLength
    );

    combined.set(salt,0);
    combined.set(iv,salt.length);
    combined.set(
        new Uint8Array(encrypted),
        salt.length + iv.length
    );

    document.getElementById("output").value =
        bufferToBase64(combined);
}

async function decryptMessage(){

    const cipherText =
        document.getElementById("message").value.trim();

    const password =
        document.getElementById("password").value;

    try{

        const data = base64ToBuffer(cipherText);

        const salt = data.slice(0,16);
        const iv = data.slice(16,28);
        const encrypted = data.slice(28);

        const key = await deriveKey(password,salt);

        const decrypted = await crypto.subtle.decrypt(
            {
                name:"AES-GCM",
                iv:iv
            },
            key,
            encrypted
        );

        document.getElementById("output").value =
            decoder.decode(decrypted);

    }catch(error){
        alert("Wrong key or invalid encrypted text.");
    }
}

function copyOutput(){
    const output = document.getElementById("output");

    output.select();
    document.execCommand("copy");

    alert("Copied!");
}
</script>

</body>
</html>
