<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Countdown</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: black;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "SF Pro Display", "Poppins", sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 40px;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .timer {
      font-size: 4rem;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }
    .current-time {
      font-size: 1.5rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>Time Left Till Midnight</h1>
  <div class="timer" id="countdown">00:00:00</div>
  <div class="current-time" id="currentTime">Current Time: --:--:--</div>

  <script>
    function updateClock() {
      const now = new Date();

      // Current time in 12-hour format
      let hrs = now.getHours();
      const mins = now.getMinutes();
      const secs = now.getSeconds();
      const ampm = hrs >= 12 ? "PM" : "AM";
      hrs = hrs % 12;
      hrs = hrs ? hrs : 12;

      document.getElementById("currentTime").innerText =
        `Current Time: ${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')} ${ampm}`;

      // Countdown till midnight
      const midnight = new Date();
      midnight.setHours(24, 0, 0, 0);
      const diff = midnight - now;

      const hoursLeft = Math.floor(diff / (1000 * 60 * 60));
      const minutesLeft = Math.floor((diff / (1000 * 60)) % 60);
      const secondsLeft = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").innerText =
        `${hoursLeft.toString().padStart(2, '0')}:${minutesLeft.toString().padStart(2, '0')}:${secondsLeft.toString().padStart(2, '0')}`;

      // Smooth background flash at midnight
      if (hoursLeft === 0 && minutesLeft === 0 && secondsLeft === 0) {
        document.body.style.transition = "background 1s";
        document.body.style.backgroundColor = "#111";
        setTimeout(() => (document.body.style.backgroundColor = "#000"), 1000);
      }
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
